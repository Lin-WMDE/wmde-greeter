[package]
name = "wmde-greeter"
version = "1.10.0"
edition = "2024"

# The PACKAGE is renamed (the binary and the i18n domain follow it: justfile takes the
# binary as target/release/<name>, and fluent_language_loader! derives the .ftl name from
# CARGO_PKG_NAME, hence i18n/*/wmde_greeter.ftl). The LIBRARY target keeps its upstream
# name so `use cosmic_greeter::...` in src/main.rs and examples/ needs no edit and upstream
# merges stay cheap - same reasoning as keeping the cosmic:: imports elsewhere in the stack.
[lib]
name = "cosmic_greeter"
path = "src/lib.rs"

[build-dependencies]
vergen = { version = "8", features = ["git", "gitcl"] }

[dependencies]
anyhow = "1"
async-fn-stream = "0.3"
icu = { version = "2.2.0", features = ["compiled_data"] }
jiff = "0.2"
jiff-icu = "0.2"
cosmic-applets-config.workspace = true
cosmic-bg-config.workspace = true
cosmic-comp-config.workspace = true
cosmic-config = { workspace = true, features = ["calloop", "macro"] }
cosmic-greeter-config.workspace = true
cosmic-greeter-daemon = { package = "wmde-greeter-daemon", path = "daemon" }
cosmic-osk-config = { git = "https://github.com/pop-os/cosmic-osk" }
dirs = "6"
libcosmic = { workspace = true, features = [
    "autosize",
    "winit",
    "multi-window",
    "desktop",
    "wayland",
    "tokio",
    # WMDE: no "dbus-config". The greeter session has no settings daemon (wmde-session
    # starts it for a user session, and it has no D-Bus activation), so every config watch
    # went over D-Bus, failed and retried for good, filling the journal with "Failed to create
    # watcher". Without the feature the configs are watched as files, which works here.
] }
tracing.workspace = true
tracing-journald = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
pam-client = "0.5.0"
pwd.workspace = true
ron.workspace = true
shlex = "1.3.0"
xkb-data = "0.2"
# WMDE: translated layout names from the xkeyboard-config catalog
gettext-rs = { version = "0.8", features = ["gettext-system"] }
libc = "0.2"
xdg = "3.0"
#TODO: reduce features
tokio = { workspace = true, features = ["full"] }
wayland-client = "0.31.14"
# cosmic-settings-subscriptions = { git = "https://github.com/pop-os/cosmic-settings-subscriptions", default-features = false, features = [
#     "accessibility",
#     "cosmic_a11y_manager",
# ] }

cosmic-settings-accessibility-subscription = { git = "https://github.com/pop-os/cosmic-settings", default-features = false }
cosmic-settings-a11y-manager-subscription = { git = "https://github.com/pop-os/cosmic-settings", default-features = false }
cosmic-settings-daemon-config = { git = "https://github.com/pop-os/cosmic-settings-daemon", default-features = false, features = [
    "greeter",
] }

cctk = { git = "https://github.com/pop-os/cosmic-protocols", package = "cosmic-client-toolkit" }
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols", default-features = false, features = [
    "client",
] }

# For network status using networkmanager feature
cosmic-dbus-networkmanager = { git = "https://github.com/pop-os/dbus-settings-bindings", optional = true }
# For logind integration using logind feature
logind-zbus = { version = "5", optional = true }
# For power status with upower feature
upower_dbus = { git = "https://github.com/pop-os/dbus-settings-bindings", optional = true }
# Required for some features
zbus = { workspace = true }
# CLI arguments
clap_lex = "1.1"
# Internationalization
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
rust-embed = "8"
futures-util = "0.3.32"
timedate-zbus = { git = "https://github.com/pop-os/dbus-settings-bindings" }
cosmic-randr-shell = { workspace = true }
kdl.workspace = true
color-eyre.workspace = true
image = { version = "0.25", default-features = false, features = [
    "avif-native",
    "jpeg",
    "png",
    "rayon",
    "webp",
    "hdr",
] }
# JPEG-XL support
jxl-oxide = { version = "0.12.6", features = ["image"] }
enumflags2 = "0.7.12"

[dependencies.greetd_ipc]
version = "0.10.3"
features = ["tokio-codec"]

[features]
default = ["logind", "networkmanager", "upower", "systemd"]
logind = ["logind-zbus", "systemd"]
systemd = ["tracing-journald"]
networkmanager = ["cosmic-dbus-networkmanager"]
upower = ["upower_dbus"]

# WMDE: shared release profile, see .doc/perf.
#  - panic = "abort" drops .eh_frame and .gcc_except_table; catch_unwind stops catching,
#    which in this stack only guards SVG parsing in iced's vector backends.
#  - lto = "fat" with one codegen unit removes what monomorphisation duplicated.
# The LTO half is expensive and single threaded; FAST=1 turns it off for development
# builds without touching panic or opt-level, so behaviour still matches what ships.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev.package.tiny-skia]
opt-level = 2

[profile.dev.package.rustybuzz]
opt-level = 2

[profile.dev.package.ttf-parser]
opt-level = 2

[workspace]
members = ["cosmic-greeter-config", "daemon"]
resolver = "3"

[workspace.package]
rust-version = "1.93"

[workspace.dependencies]
tracing = "0.1"
tracing-journald = { version = "0.3" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
color-eyre = "0.6.5"
pwd = "1.4.0"
ron = "0.12"
serde = "1"
tokio = "1.52.1"
zbus = "5"
kdl = "6"
cosmic-randr-shell = { git = "https://github.com/pop-os/cosmic-randr", default-features = false }

[workspace.dependencies.cosmic-applets-config]
git = "https://github.com/pop-os/cosmic-applets"
default-features = false

# wmde-bg renamed its config crate to `wmde-bg-config` (it ships the fun.wmde.Background
# id); alias it back to the `cosmic-bg-config` dependency key so every `cosmic_bg_config::`
# import keeps resolving. This has to be a direct path dep rather than a [patch] entry -
# [patch] cannot rename a package, so the patch is silently ignored and the greeter ends up
# reading the upstream com.system76 background namespace.
[workspace.dependencies.cosmic-bg-config]
package = "wmde-bg-config"
path = "../wmde-bg/config"
default-features = false

[workspace.dependencies.cosmic-comp-config]
git = "https://github.com/pop-os/cosmic-comp"
default-features = false
features = ["output", "randr"]

[workspace.dependencies.cosmic-greeter-config]
path = "cosmic-greeter-config"

[workspace.dependencies.cosmic-config]
git = "https://github.com/pop-os/libcosmic"
default-features = false

[workspace.dependencies.cosmic-theme]
git = "https://github.com/pop-os/libcosmic"
default-features = false

[workspace.dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic"
default-features = false
features = ["advanced-shaping"]

[patch."https://github.com/pop-os/cosmic-protocols"]
cctk = { git = "https://github.com/pop-os/cosmic-protocols//", package = "cosmic-client-toolkit", rev = "c0cff4d" }
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "c0cff4d" }

# WMDE forks (local sibling paths). libcosmic carries the wmde config-root + fun.wmde.*
# theme/toolkit ids; the sibling forks carry the renamed cross-component config ids this
# binary reads (comp config, wallpapers, applet clock format, randr, the greeter
# accessibility handoff). All three URL spellings, because the crates in the graph declare
# the same source with and without a trailing slash or .git - miss one and two different
# libcosmic end up in the graph.
[patch."https://github.com/pop-os/libcosmic"]
libcosmic = { path = "../libcosmic" }
cosmic-config = { path = "../libcosmic/cosmic-config" }
cosmic-config-derive = { path = "../libcosmic/cosmic-config-derive" }
cosmic-theme = { path = "../libcosmic/cosmic-theme" }
iced = { path = "../libcosmic/iced" }
iced_accessibility = { path = "../libcosmic/iced/accessibility" }
iced_core = { path = "../libcosmic/iced/core" }
iced_debug = { path = "../libcosmic/iced/debug" }
iced_futures = { path = "../libcosmic/iced/futures" }
iced_graphics = { path = "../libcosmic/iced/graphics" }
iced_program = { path = "../libcosmic/iced/program" }
iced_renderer = { path = "../libcosmic/iced/renderer" }
iced_runtime = { path = "../libcosmic/iced/runtime" }
iced_tiny_skia = { path = "../libcosmic/iced/tiny_skia" }
iced_wgpu = { path = "../libcosmic/iced/wgpu" }
iced_widget = { path = "../libcosmic/iced/widget" }
iced_winit = { path = "../libcosmic/iced/winit" }

[patch."https://github.com/pop-os/cosmic-comp"]
cosmic-comp-config = { path = "../wmde-comp/cosmic-comp-config" }

[patch."https://github.com/pop-os/cosmic-applets"]
cosmic-applets-config = { path = "../wmde-applets/cosmic-applets-config" }

[patch."https://github.com/pop-os/cosmic-settings-daemon"]
cosmic-settings-daemon-config = { path = "../wmde-settings-daemon/cosmic-settings-daemon-config" }

[patch."https://github.com/pop-os/cosmic-settings"]
cosmic-settings-accessibility-subscription = { path = "../wmde-settings/subscriptions/accessibility" }
cosmic-settings-a11y-manager-subscription = { path = "../wmde-settings/subscriptions/a11y-manager" }

[patch."https://github.com/pop-os/cosmic-randr"]
cosmic-randr-shell = { path = "../wmde-randr/shell" }

[patch."https://github.com/pop-os/dbus-settings-bindings"]
cosmic-dbus-a11y = { path = "../wmde-dbus-settings-bindings/a11y" }
cosmic-dbus-networkmanager = { path = "../wmde-dbus-settings-bindings/networkmanager" }
upower_dbus = { path = "../wmde-dbus-settings-bindings/upower" }
timedate-zbus = { path = "../wmde-dbus-settings-bindings/timedate" }

